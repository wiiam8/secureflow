{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="text-center mb-4"><h1 class="h3"><span class="brand-mark">&#9670;</span> SecureFlow</h1>
    <div class="muted">Explainable security decisions for your pipeline</div></div>
  <div class="card"><div class="card-body p-4">
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <div class="mb-3"><label class="form-label" for="u">Username</label>
        <input id="u" name="username" class="form-control" required autofocus autocomplete="username"></div>
      <div class="mb-3"><label class="form-label" for="p">Password</label>
        <input id="p" name="password" type="password" class="form-control" required autocomplete="current-password"></div>
      <button class="btn btn-dark w-100">Sign in</button>
    </form>
  </div></div>
</div>
{% endblock %}
